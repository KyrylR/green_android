name: Android Dev Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: android-dev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish dev APK
    runs-on: ubuntu-latest

    env:
      REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID || vars.REOWN_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Validate Reown project id
        run: |
          if [[ -z "${REOWN_PROJECT_ID:-}" ]]; then
            echo "REOWN_PROJECT_ID is not configured. Add a repository secret or variable named REOWN_PROJECT_ID." >&2
            exit 1
          fi

      - name: Build development debug APK
        run: ./gradlew :androidApp:assembleDevelopmentDebug -PandroidOnly=true --stacktrace

      - name: Verify Reown project id was packaged
        run: |
          python3 <<'PY'
          import base64
          import json
          import pathlib
          import re
          import sys

          build_config = pathlib.Path(
              "androidApp/build/generated/source/buildConfig/development/debug/com/blockstream/green/BuildConfig.java"
          )
          text = build_config.read_text()
          match = re.search(r'APP_KEYS = "(.*)";', text)
          if not match or not match.group(1):
              print("BuildConfig.APP_KEYS is empty.", file=sys.stderr)
              sys.exit(1)

          try:
              app_keys = json.loads(base64.b64decode(match.group(1)).decode())
          except Exception as error:
              print(f"BuildConfig.APP_KEYS is not valid base64-encoded JSON: {error}", file=sys.stderr)
              sys.exit(1)

          if not app_keys.get("reown_project_id"):
              print("BuildConfig.APP_KEYS is missing reown_project_id.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Collect APK
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/development/debug/*.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "No development debug APK was produced." >&2
            find androidApp/build/outputs/apk -type f -name "*.apk" -print >&2 || true
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp "$apk" "release-assets/$(basename "$apk")"
          done

          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Build release notes
        run: |
          tag="$GITHUB_REF_NAME"
          tag_sha="$(git rev-list -n 1 "$tag")"
          previous_tag="$(git describe --tags --abbrev=0 "${tag_sha}^" 2>/dev/null || true)"

          {
            echo "# $tag"
            echo
            echo "Android development debug APK."
            echo

            if [[ -n "$previous_tag" ]]; then
              echo "## Commits since $previous_tag"
              echo
              git log --reverse --pretty=format:'- %h %s (%an)' "$previous_tag..$tag"
            else
              echo "## Commits"
              echo
              git log --reverse --pretty=format:'- %h %s (%an)' "$tag"
            fi

            echo
            echo
            echo "## SHA-256"
            echo
            sed 's/^/- `/' release-assets/SHA256SUMS.txt | sed 's/$/`/'
          } > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
